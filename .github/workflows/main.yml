name: Telegram Daily Bot

on:
  schedule:
    # 03:00 UTC = 08:00 по Екатеринбургу
    - cron: "0 3 * * *"

    # 15:00 UTC = 20:00 по Екатеринбургу
    - cron: "0 15 * * *"

  workflow_dispatch:
    inputs:
      message_type:
        description: "Какое сообщение проверить?"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - evening

jobs:
  send-message:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram message
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MANUAL_TYPE: ${{ inputs.message_type }}

        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MESSAGE_TYPE="${MANUAL_TYPE}"
          elif [ "${{ github.event.schedule }}" = "0 15 * * *" ]; then
            MESSAGE_TYPE="evening"
          else
            MESSAGE_TYPE="morning"
          fi

          if [ "${MESSAGE_TYPE}" = "evening" ]; then

            MESSAGE=$'🌙 Венера, привет!\n\nКак прошёл твой день вчера?\n\nВыбери настроение:\n\n🟢 Отлично\n😊 Хорошо\n😐 Нейтрально\n🔴 Ужасно\n\nПосле выбора коротко напиши, почему ты так оценила день.\n\n✨ Что можно было сделать, чтобы этот день стал ещё лучше?'

            KEYBOARD='{"keyboard":[[{"text":"🟢 Отлично"},{"text":"😊 Хорошо"}],[{"text":"😐 Нейтрально"},{"text":"🔴 Ужасно"}]],"resize_keyboard":true,"one_time_keyboard":true}'

            curl --fail --silent --show-error \
              -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}" \
              --data-urlencode "reply_markup=${KEYBOARD}"

          else

            MESSAGE=$'💛 Венера, привет!\n\nКак проходит твой день?\n\nСделай небольшую паузу и вспомни, за что ты можешь поблагодарить сегодняшний день.\n\nВот три идеи:\n\n🌿 Что сегодня уже принесло тебе радость?\n\n💛 Кто или что поддерживает тебя прямо сейчас?\n\n✨ Какое событие или возможность сегодня вызывает у тебя чувство благодарности?\n\nДобавь ещё три своих повода для благодарности.\n\nПусть эта небольшая практика поможет тебе почувствовать опору и продолжить день с хорошим настроением. ❤️'

            curl --fail --silent --show-error \
              -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}" \
              --data-urlencode 'reply_markup={"remove_keyboard":true}'

          fi
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}" \
              --data-urlencode 'reply_markup={"remove_keyboard":true}'

          fi
