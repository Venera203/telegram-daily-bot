name: Telegram Daily Bot

on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:

jobs:
  send-message:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram message
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 15 * * *" ]; then
            MESSAGE=$'🌙 Как прошёл твой день?\n\nВыбери настроение:\n\n🟢 Отлично\n😊 Хорошо\n😐 Нейтрально\n🔴 Ужасно'
          else
            MESSAGE=$'🌞 Доброе утро, Венера!\n\nСегодня поблагодари за:\n\n💛 Новые возможности, которые принесёт этот день.\n🌿 Здоровье и силы двигаться к своим целям.\n🤝 Людей, которые поддерживают тебя и помогают расти.\n\nСделай паузу на минуту и добавь ещё 3 своих благодарности. Пусть это станет хорошим началом дня. ✨'
          fi

          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
