name: Telegram Daily Bot

on:
  schedule:
    # Каждый день в 08:00 по Екатеринбургу
    - cron: "0 8 * * *"
      timezone: "Asia/Yekaterinburg"

    # Каждый день в 20:00 по Екатеринбургу
    - cron: "0 20 * * *"
      timezone: "Asia/Yekaterinburg"

  workflow_dispatch:
    inputs:
      message_type:
        description: "Какое сообщение проверить?"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - evening

jobs:
  send-message:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram message
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MANUAL_TYPE: ${{ inputs.message_type }}

        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MESSAGE_TYPE="${MANUAL_TYPE}"
          elif [ "${{ github.event.schedule }}" = "0 20 * * *" ]; then
            MESSAGE_TYPE="evening"
          else
            MESSAGE_TYPE="morning"
          fi

          if [ "${MESSAGE_TYPE}" = "evening" ]; then

            MESSAGE=$'🌙 Венера, привет!\n\nКак прошёл твой день сегодня?\n\nВыбери настроение:\n\n🟢 Отлично\n😊 Хорошо\n😐 Нейтрально\n🔴 Ужасно\n\nПосле выбора коротко напиши, почему ты так оценила свой день.\n\n✨ И подумай: что бы ты сделала, чтобы сегодняшний день стал ещё лучше?'

            KEYBOARD='{
              "keyboard": [
                [
                  {"text": "🟢 Отлично"},
                  {"text": "😊 Хорошо"}
                ],
                [
                  {"text": "😐 Нейтрально"},
                  {"text": "🔴 Ужасно"}
                ]
              ],
              "resize_keyboard": true,
              "one_time_keyboard": true
            }'

            curl --fail --silent --show-error \
              -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}" \
              --data-urlencode "reply_markup=${KEYBOARD}"

          else

            MESSAGE=$'💛 Венера, привет!\n\nКак проходит твой день?\n\nСделай небольшую паузу и вспомни, за что ты можешь поблагодарить сегодняшний день.\n\nВот три идеи:\n\n🌿 Что сегодня уже принесло тебе радость?\n\n💛 Кто или что поддерживает тебя прямо сейчас?\n\n✨ Какое событие или возможность сегодня вызывает у тебя чувство благодарности?\n\nДобавь ещё три своих повода для благодарности.\n\nПусть эта небольшая практика поможет тебе почувствовать опору и продолжить день с хорошим настроением. ❤️'

            curl --fail --silent --show-error \
              -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}" \
              --data-urlencode 'reply_markup={"remove_keyboard":true}'

          fi
