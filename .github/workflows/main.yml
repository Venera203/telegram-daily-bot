name: Telegram Daily Bot

on:
  schedule:
    - cron: "7 3 * * *"
    - cron: "7 15 * * *"

  workflow_dispatch:
    inputs:
      message_type:
        description: "Какое сообщение проверить?"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - evening

jobs:
  send-message:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram message
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MANUAL_TYPE: ${{ inputs.message_type }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MESSAGE_TYPE="${MANUAL_TYPE}"
          elif [ "${{ github.event.schedule }}" = "7 20 * * *" ]; then
            MESSAGE_TYPE="evening"
          else
            MESSAGE_TYPE="morning"
          fi

          if [ "${MESSAGE_TYPE}" = "evening" ]; then
            MESSAGE=$'🌙 Как прошёл твой день?\n\nВыбери настроение кнопкой ниже:\n\n✨ Что бы ты сделала, чтобы сегодняшний день стал ещё лучше?'
            KEYBOARD='{"keyboard":[[{"text":"🟢 Отлично"},{"text":"😊 Хорошо"}],[{"text":"😐 Нейтрально"},{"text":"🔴 Ужасно"}]],"resize_keyboard":true,"one_time_keyboard":true}'

            curl --fail --silent --show-error \
              -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}" \
              --data-urlencode "reply_markup=${KEYBOARD}"
          else
            MESSAGE=$'🌞 Доброе утро, Венера!\n\nСегодня поблагодари за:\n\n💛 Новые возможности, которые принесёт этот день.\n🌿 Здоровье и силы двигаться к своим целям.\n🤝 Людей, которые поддерживают тебя и помогают расти.\n\nСделай паузу на минуту и добавь ещё 3 своих благодарности. Пусть это станет хорошим началом дня. ✨'

            curl --fail --silent --show-error \
              -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}" \
              --data-urlencode 'reply_markup={"remove_keyboard":true}'
          fi
